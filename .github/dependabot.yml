version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule: { interval: weekly }
    groups:
      # init, analyze and upload-sarif must run the same version: a mixed
      # set makes the analyze post-step fail on a config-version mismatch.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: pip
    directory: /
    target-branch: staging
    schedule: { interval: weekly }

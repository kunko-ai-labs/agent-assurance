name: Feature request
description: A new observed source, a new check, a report format, an integration.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do, or not prove, today? Who is asking (developer, reviewer, auditor)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the tool observe, decide or emit? Where would the person see it (CLI, PR comment, card, SARIF, attestation)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "another tool already does this" — link it; see [docs/landscape.md](https://github.com/kunko-ai-labs/agent-assurance/blob/main/docs/landscape.md).
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: The project's rules are in the README ("Rules you can rely on").
      options:
        - label: This does not require an LLM in the verdict
          required: true
        - label: This does not require executing repo code, starting an MCP server, reading secret values or network access at scan time
          required: true
        - label: This is not runtime interception of tool calls (out of scope by design)
          required: true

name: "Agent Assurance"
description: "Transparent, framework-agnostic assurance checks for AI agents, mapped to OWASP Agentic security standards."
author: "Kunko AI Labs"
branding:
  icon: "shield"
  color: "red"

# Every input reaches the scripts below through `env:` and is quoted as "$VAR".
# No `run:` body contains an expression or `eval`; tests/test_action_inputs.py
# enforces this and runs the scripts with hostile input values.

inputs:
  mode:
    description: "'check' runs the checks on the manifest alone; 'scan' observes the repo's agent configuration and verifies it against the manifest if one exists; 'diff' (on pull_request) compares base vs head and reports what the change does to reach and promise"
    required: false
    default: "check"
  comment:
    description: "In diff mode on a pull_request: post/update one PR comment with the result (needs permissions: pull-requests: write)"
    required: false
    default: "true"
  fail-on-delta:
    description: "In diff mode: also fail when reach grows, the band rises or the promise breaks. 'true' (default) or 'false'"
    required: false
    default: "true"
  directory:
    description: "Directory to scan (mode: scan)"
    required: false
    default: "."
  manifest:
    description: "Path to the agent-assurance.yaml manifest (the promise). In scan mode it is optional: <directory>/agent-assurance.yaml is picked up automatically"
    required: false
    default: "agent-assurance.yaml"
  check:
    description: "Check to run (e.g. blast-radius) or 'all'"
    required: false
    default: "all"
  fail-on:
    description: "What fails the job: 'fail' (default) fails on FAIL only and lets REVIEW through with a warning; 'review' fails on REVIEW and FAIL. A result that cannot be verified is REVIEW, never PASS"
    required: false
    default: "fail"
  sarif:
    description: "Also emit a SARIF file at this path (e.g. aa.sarif)"
    required: false
    default: ""
  upload-sarif:
    description: "Upload the SARIF to GitHub code scanning (needs permissions: security-events: write)"
    required: false
    default: "false"
  policy:
    description: "Organisation policy file (weights, bands, promise semantics, own MCP catalogue). Default: agent-assurance.policy.yaml in the scanned directory, if present"
    required: false
    default: ""
  card:
    description: "Also write a single-file HTML capability card at this path (uploaded as an artifact)"
    required: false
    default: ""
  attest:
    description: "'' (default): no attestation. 'write': write an unsigned in-toto statement (aa-attestation.json, uploaded as an artifact). 'sign': write it and sign it with Sigstore via actions/attest (needs permissions: id-token: write, attestations: write; public repo or GitHub Enterprise). Only 'sign' produces a signature"
    required: false
    default: ""

outputs:
  verdict:
    description: "PASS, REVIEW or FAIL (in diff mode, the head side's verdict). An unknown capability or a promise that cannot be verified is REVIEW, never PASS. ERROR when no verdict was produced; the job then fails"
    value: ${{ steps.run.outputs.verdict }}
  gate:
    description: "'tripped' when the verdict (or, in diff mode, the delta) fails the job under fail-on / fail-on-delta; 'open' otherwise"
    value: ${{ steps.run.outputs.gate }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install agent-assurance
      shell: bash
      run: pip install "$GITHUB_ACTION_PATH"

    - name: Validate inputs
      shell: bash
      # Input values are never echoed here: a value is data, not a log line.
      env:
        AA_MODE: ${{ inputs.mode }}
        AA_FAIL_ON: ${{ inputs.fail-on }}
        AA_FAIL_ON_DELTA: ${{ inputs.fail-on-delta }}
        AA_ATTEST: ${{ inputs.attest }}
        AA_CHECK: ${{ inputs.check }}
        AA_COMMENT: ${{ inputs.comment }}
        AA_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
      run: |
        bad() { echo "::error::agent-assurance: input '$1' must be $2"; exit 2; }
        case "$AA_MODE" in check|scan|diff) ;; *) bad mode "check, scan or diff" ;; esac
        case "$AA_FAIL_ON" in fail|review) ;; *) bad fail-on "fail or review" ;; esac
        case "$AA_FAIL_ON_DELTA" in true|false) ;; *) bad fail-on-delta "true or false" ;; esac
        case "$AA_ATTEST" in ""|write|sign) ;; *) bad attest "empty, write or sign" ;; esac
        case "$AA_CHECK" in ""|-*) bad check "a check id, an alias or 'all'" ;; esac
        # Not gate inputs: an unexpected value keeps its old meaning (false), with a warning.
        case "$AA_COMMENT" in true|false) ;; *) echo "::warning::agent-assurance: input 'comment' is not 'true' or 'false'; no comment will be posted" ;; esac
        case "$AA_UPLOAD_SARIF" in true|false) ;; *) echo "::warning::agent-assurance: input 'upload-sarif' is not 'true' or 'false'; the SARIF will not be uploaded" ;; esac

    - name: "Check out the base tree (mode: diff)"
      if: ${{ inputs.mode == 'diff' }}
      shell: bash
      env:
        AA_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      # The PR base goes into a detached worktree; nothing in it is executed.
      run: |
        if [ -z "$AA_BASE" ] || [ "$AA_BASE" = "0000000000000000000000000000000000000000" ]; then
          echo "::error::diff mode needs a pull_request (or push with a previous commit) event"; exit 2
        fi
        git fetch --no-tags --depth=1 origin "$AA_BASE"
        git worktree add --detach "$RUNNER_TEMP/aa-base" "$AA_BASE"
        echo "base=$AA_BASE"

    - name: Run Agent Assurance
      id: run
      shell: bash
      env:
        AA_MODE: ${{ inputs.mode }}
        AA_DIRECTORY: ${{ inputs.directory }}
        AA_MANIFEST: ${{ inputs.manifest }}
        AA_CHECK: ${{ inputs.check }}
        AA_POLICY: ${{ inputs.policy }}
        AA_FAIL_ON: ${{ inputs.fail-on }}
        AA_FAIL_ON_DELTA: ${{ inputs.fail-on-delta }}
        AA_SARIF: ${{ inputs.sarif }}
        AA_CARD: ${{ inputs.card }}
      # One argv, built here as an array, serves every format so the report,
      # the verdict, the SARIF and the card agree. Options take their value
      # after '='; a positional path that starts with '-' gets './' in front,
      # so no input value can turn into an option.
      run: |
        dir=$AA_DIRECTORY
        case "$dir" in -*) dir="./$dir" ;; esac
        manifest=$AA_MANIFEST
        case "$manifest" in -*) manifest="./$manifest" ;; esac
        case "$AA_MODE" in
          scan)
            args=(scan "$dir" "--check=$AA_CHECK")
            if [ -f "$AA_MANIFEST" ]; then args+=("--manifest=$AA_MANIFEST"); fi ;;
          diff)
            args=(diff "$RUNNER_TEMP/aa-base/$AA_DIRECTORY" "$dir")
            if [ "$AA_FAIL_ON_DELTA" = "true" ]; then args+=(--fail-on-delta); fi ;;
          *)
            args=(check "$AA_CHECK" "$manifest") ;;
        esac
        if [ -n "$AA_POLICY" ]; then args+=("--policy=$AA_POLICY"); fi
        printf 'command: agent-assurance'; printf ' %q' "${args[@]}"; echo

        json="$RUNNER_TEMP/aa-report.json"
        rm -f aa-report.md "$json"
        set +e
        agent-assurance "${args[@]}" --format md --output=aa-report.md "--fail-on=$AA_FAIL_ON"
        code=$?
        agent-assurance "${args[@]}" --format json "--output=$json" "--fail-on=$AA_FAIL_ON" 2> /dev/null
        set -e
        verdict=$(python3 - "$json" <<'PY'
        import json, sys
        try:
            with open(sys.argv[1], encoding="utf-8") as fh:
                d = json.load(fh)
            v = (d["head"] if d.get("kind") == "diff" else d)["verdict"]
        except Exception:
            v = "ERROR"
        print(v if v in ("PASS", "REVIEW", "FAIL") else "ERROR")
        PY
        )
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

        if [ -f aa-report.md ]; then
          cat aa-report.md >> "$GITHUB_STEP_SUMMARY"
        fi
        # No report or no verdict is not a result: fail loudly and now, never as a pass.
        if [ "$code" -eq 2 ] || [ ! -f aa-report.md ] || [ "$verdict" = "ERROR" ]; then
          echo "::error::agent-assurance produced no verdict (exit $code). Check the inputs, the manifest path and its schema." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "gate=tripped" >> "$GITHUB_OUTPUT"
          exit 2
        fi
        # exit 1 = the gate tripped; a FAIL verdict trips it whatever the exit code.
        if [ "$code" -ne 0 ] || [ "$verdict" = "FAIL" ]; then
          echo "gate=tripped" >> "$GITHUB_OUTPUT"
        else
          echo "gate=open" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = "REVIEW" ]; then
            echo "::warning::Agent Assurance verdict is REVIEW: a human should look at it. The job continues because fail-on is 'fail'; set fail-on: review to block on it."
          fi
        fi

        # The verdict is recorded above; here only exit 2 (no output) matters.
        if [ -n "$AA_SARIF" ]; then
          agent-assurance "${args[@]}" --format sarif "--output=$AA_SARIF" || [ $? -ne 2 ]
        fi
        if [ -n "$AA_CARD" ]; then
          agent-assurance "${args[@]}" --format html "--output=$AA_CARD" || [ $? -ne 2 ]
        fi

    - name: "Comment on the pull request (mode: diff)"
      # Skipped on pull requests from forks: their token cannot write comments.
      if: ${{ inputs.mode == 'diff' && inputs.comment == 'true' && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        AA_DIRECTORY: ${{ inputs.directory }}
      # One comment per (directory), updated on every push instead of a new one.
      # The marker reaches jq as data (--arg), never as part of the filter.
      run: |
        marker="<!-- agent-assurance:$AA_DIRECTORY -->"
        { printf '%s\n' "$marker"; cat aa-report.md; } > aa-comment.md
        id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              | jq -r --arg m "$marker" '.[] | select(.body | startswith($m)) | .id' | head -1 || true)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@aa-comment.md > /dev/null
          echo "updated comment $id"
        else
          gh pr comment "$PR" --body-file aa-comment.md
        fi

    - name: Upload capability card
      if: ${{ inputs.card != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: agent-assurance-card
        path: ${{ inputs.card }}

    - name: "Write attestation (optional, unsigned)"
      if: ${{ inputs.attest != '' && inputs.mode != 'diff' }}
      id: attest
      shell: bash
      env:
        AA_DIRECTORY: ${{ inputs.directory }}
        AA_MANIFEST: ${{ inputs.manifest }}
        AA_CHECK: ${{ inputs.check }}
        AA_POLICY: ${{ inputs.policy }}
      # Evidence is written whatever the verdict; only a usage error (2) stops here.
      # Writing the statement is not signing it: only the Sigstore step below signs.
      run: |
        dir=$AA_DIRECTORY
        case "$dir" in -*) dir="./$dir" ;; esac
        args=(attest "$dir" "--check=$AA_CHECK")
        if [ -f "$AA_MANIFEST" ]; then args+=("--manifest=$AA_MANIFEST"); fi
        if [ -n "$AA_POLICY" ]; then args+=("--policy=$AA_POLICY"); fi
        rm -f aa-attestation.json
        agent-assurance "${args[@]}" --output=aa-attestation.json || [ $? -ne 2 ]
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os, secrets
        with open("aa-attestation.json", encoding="utf-8") as fh:
            s = json.load(fh)
        d = os.environ.get("AA_DIRECTORY", ".")
        paths = "\n".join(os.path.normpath(os.path.join(d, x["name"])) for x in s["subject"])
        # A random delimiter: no path can end the multiline output early.
        eof = "EOF_" + secrets.token_hex(16)
        print(f"subjects<<{eof}\n{paths}\n{eof}")
        PY

    - name: Upload attestation artifact
      if: ${{ inputs.attest != '' && inputs.mode != 'diff' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: agent-assurance-attestation
        path: aa-attestation.json

    - name: "Sign attestation with Sigstore (optional)"
      if: ${{ inputs.attest == 'sign' && inputs.mode != 'diff' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ steps.attest.outputs.subjects }}
        predicate-type: https://github.com/kunko-ai-labs/agent-assurance/attestation/v1
        predicate-path: aa-attestation.json

    - name: Upload SARIF to code scanning (optional)
      if: ${{ inputs.sarif != '' && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ inputs.sarif }}
        category: agent-assurance

    - name: Fail if assurance gate tripped
      if: ${{ steps.run.outputs.gate == 'tripped' }}
      shell: bash
      env:
        AA_FAIL_ON: ${{ inputs.fail-on }}
        AA_VERDICT: ${{ steps.run.outputs.verdict }}
      run: |
        echo "Agent Assurance gate failed (verdict=$AA_VERDICT, fail-on=$AA_FAIL_ON)." >&2
        exit 1

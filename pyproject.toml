[project]
name = "agent-assurance"
version = "0.5.2"
description = "Transparent, framework-agnostic assurance checks for AI agents, mapped to OWASP Agentic security standards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kunko AI Labs" }]
keywords = ["ai-agents", "ai-security", "governance", "owasp", "assurance", "blast-radius", "mcp", "claude-code", "sarif", "in-toto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/kunko-ai-labs/agent-assurance"
Repository = "https://github.com/kunko-ai-labs/agent-assurance"
Documentation = "https://github.com/kunko-ai-labs/agent-assurance/tree/main/docs"
Changelog = "https://github.com/kunko-ai-labs/agent-assurance/releases"
Issues = "https://github.com/kunko-ai-labs/agent-assurance/issues"
Security = "https://github.com/kunko-ai-labs/agent-assurance/blob/main/SECURITY.md"

[project.scripts]
agent-assurance = "agent_assurance.cli:main"
agent-assurance-mcp = "agent_assurance.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "mcp>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_assurance"]

[tool.ruff]
line-length = 100
target-version = "py310"

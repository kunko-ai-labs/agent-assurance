name: Branch flow

# main accepts pull requests only from staging, or from a maintainer's hotfix/* branch
# in this repository. Contributions go to develop; see CONTRIBUTING.md.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  branch-flow:
    name: main accepts staging or hotfix only
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::Pull requests into main must come from this repository, not a fork. Open your pull request into develop."
            exit 1
          fi
          case "$HEAD_REF" in
            staging|hotfix/*) echo "ok: $HEAD_REF -> main" ;;
            *) echo "::error::main accepts pull requests only from staging or hotfix/*. Open your pull request into develop."; exit 1 ;;
          esac

name: Bug report
description: A crash, a wrong exit code, a broken output format, or an integration that does not behave as documented.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: For a verdict you disagree with, use **Wrong verdict** instead. For anything that makes the tool execute code, read a secret value or reach the network, use the private security advisory.
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: "agent-assurance 0.5.2 · Python 3.12 · macOS 15 / GitHub Action mode=diff"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Command(s) and the smallest files that reproduce it. A link to a public repo or a PR run is ideal.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Full output or traceback. Exit code if relevant (`echo $?`).
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

[project]
name = "agent-assurance"
version = "0.5.1"
description = "Transparent, framework-agnostic assurance checks for AI agents, mapped to OWASP Agentic security standards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kunko AI Labs" }]
keywords = ["ai-agents", "ai-security", "governance", "owasp", "assurance", "blast-radius"]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/kunko-ai-labs/agent-assurance"
Repository = "https://github.com/kunko-ai-labs/agent-assurance"

[project.scripts]
agent-assurance = "agent_assurance.cli:main"
agent-assurance-mcp = "agent_assurance.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "mcp>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_assurance"]

[tool.ruff]
line-length = 100
target-version = "py310"
